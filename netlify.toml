# Configuración de despliegue para Netlify
# Sitio estático: sin proceso de build, se publica la raíz del repo.
[build]
  publish = "."
  command = ""
  # Carpeta de funciones serverless (IA opcional). Si no configuras API keys,
  # el sitio sigue funcionando 100% en modo local.
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
