# Configuración de despliegue para Netlify
# Sitio estático: sin proceso de build, se publica la raíz del repo.
[build]
  publish = "."
  command = ""
  # Carpeta de funciones serverless (IA opcional). Si no configuras API keys,
  # el sitio sigue funcionando 100% en modo local.
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Rutas /api/* -> funciones de Netlify.
# El frontend llama a /api/* (ruta compatible con Cloudflare Pages).
# En Netlify reescribimos esas rutas a las funciones nativas, así el
# MISMO repositorio funciona en Netlify y en Cloudflare durante la migración.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
