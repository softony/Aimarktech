# Configuración de despliegue para Netlify
# Sitio estático: sin proceso de build, se publica la raíz del repo.
[build]
  publish = "."
  command = ""
  # Carpeta de funciones serverless (IA opcional). Si no configuras API keys,
  # el sitio sigue funcionando 100% en modo local.
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Redirección 301 permanente: el sitio oficial ahora vive en Cloudflare,
# bajo el dominio soyaimarktech.com. Todo el tráfico que llegue a la URL
# vieja de Netlify (soyaimarktech.netlify.app) se manda al dominio nuevo,
# conservando la ruta. Esto consolida el SEO en un solo dominio y evita
# contenido duplicado. (Solo afecta a Netlify; Cloudflare ignora este archivo.)
[[redirects]]
  from = "/*"
  to = "https://soyaimarktech.com/:splat"
  status = 301
  force = true

# (Histórico) Rutas /api/* -> funciones de Netlify. Queda por debajo de la
# redirección anterior, por lo que ya no se alcanza; se conserva como respaldo
# por si se desactivara temporalmente la redirección al dominio nuevo.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
